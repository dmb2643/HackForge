services:
  frontend:
    build:
      context: ./react-router-ssr
      dockerfile: Dockerfile
    container_name: hackforge_frontend
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8080/api

  backend:
    build:
      context: ./backend
    container_name: hackforge_backend
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
